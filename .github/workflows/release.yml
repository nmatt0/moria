name: release

# Build prebuilt binaries on every version tag (e.g. `git tag v1.0.0 && git push
# --tags`) and attach one self-contained tarball per platform to the GitHub
# Release. The binary embeds its signature sets, so each tarball is just the
# binary plus the man page and license/readme.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the .deb from and attach it to"
        required: true

permissions:
  contents: write        # needed to create/update the Release

jobs:
  build:
    if: github.event_name == 'push'        # binary tarballs only on a tag push
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            installer: apt
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            installer: apt
          - name: macos-arm64
            runner: macos-latest
            installer: brew
    steps:
      - uses: actions/checkout@v4

      # VERSION is the single source of truth (CMakeLists.txt and package.nix both
      # read it). The git tag and debian/changelog carry the number independently,
      # so fail the release if either drifts from VERSION rather than shipping a
      # mislabeled artifact.
      - name: Version consistency
        run: |
          ver="$(cat VERSION)"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git tag $GITHUB_REF_NAME does not match VERSION (v$ver)"; exit 1
          fi
          deb="$(sed -n '1s/.*(\([^-)]*\).*/\1/p' debian/changelog)"
          if [ "$deb" != "$ver" ]; then
            echo "::error::debian/changelog version $deb does not match VERSION $ver"; exit 1
          fi

      - name: Install build dependencies (apt)
        if: matrix.installer == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3 \
            zlib1g-dev liblzma-dev liblz4-dev libzstd-dev

      - name: Install build dependencies (brew)
        if: matrix.installer == 'brew'
        run: |
          brew install cmake xz lz4 zstd
          # zlib ships with the macOS SDK; xz provides liblzma.

      - name: Configure and build (Release)
        run: |
          # On macOS point CMake at the Homebrew prefix so it finds the
          # Homebrew liblzma/lz4/zstd (system zlib is found without help).
          if [ "${{ matrix.installer }}" = "brew" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build build -j

      - name: Test gate
        run: |
          ./build/moria_unit
          python3 tests/test_samples.py

      - name: Package
        run: |
          pkg="moria-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/${pkg}"
          cp build/moria moria.1 LICENSE README.md "dist/${pkg}/"
          tar -C dist -czf "${pkg}.tar.gz" "${pkg}"
          # sha256sum on Linux, shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          else
            shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          fi

      - name: Attach to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            moria-*-${{ matrix.name }}.tar.gz
            moria-*-${{ matrix.name }}.tar.gz.sha256

  deb:
    name: deb-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dpkg-dev cmake lintian \
            zlib1g-dev liblzma-dev liblz4-dev libzstd-dev

      - name: Build .deb
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          cp ../moria-fw_*.deb dist/        # main package only (not -dbgsym)
          ( cd dist && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done )

      - name: Lintian (advisory)
        run: lintian ../moria-fw_*.changes || true

      - name: Attach .deb to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
