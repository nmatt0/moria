name = "jzlzma-raw"
category = "compression"

# RAW (bare) Ingenic jzlzma stream: just the dict_size + uncompressed_size pair
# of the mark_rootfs_lzma header, with no payload_size field and no 0x27051956
# magic. This is the form that lands inside U-Boot legacy uImages on newer
# T-series SoCs (T40/T41, e.g. Wyze Cam v4): the uImage header declares
# ih_comp = 3 ("lzma"), but the payload is the SoC's hardware-LZ77 stream, not
# standard LZMA:
#   [0..4)  dict_size     u32   decoder window (LE; 64 KiB..128 MiB typical)
#   [4..8)  uncomp_size   u32   exact decoded size (LE)
#   [8..)   jzlzma bitstream
# There is no reliable magic, so candidates are found structurally (the dict
# field doubles as the anchor) and validated by trial-decoding to uncomp_size
# bytes (a short decode covering >= 90% is accepted: T41 images over-declare
# by ~1 KiB of NUL-literal padding). The wrapped form (payload_size + magic
# prefix) is matched by the "jzlzma" signature instead; this validator rejects
# candidates sitting inside one (a BE 0x27051956 u32 immediately before the
# anchor) so the two never double-report the same stream.
struct = """
  u32 dict_size;
  u32 uncomp_size;
"""

constraints = [
  "dict_size > 0",
  "dict_size <= 0x10000000",
  "uncomp_size > 0",
  "uncomp_size <= 0x10000000",
]

# Placeholder only — the finding's true span (8 + bytes consumed by the
# bitstream) is set by the validator after a successful decode.
size = "8"
validator = "jzlzma_raw"
# The anchor IS the struct's first field (dict_size), so the magic sits at
# struct offset 0.
magic_offset = 0
confidence = "structural"

# LE byte strings of dict_size = 2^16 .. 2^27 (hex = bytes in file order).
[[magic]]
hex = "00000100"   # 64 KiB
endian = "little"

[[magic]]
hex = "00000200"   # 128 KiB
endian = "little"

[[magic]]
hex = "00000400"   # 256 KiB
endian = "little"

[[magic]]
hex = "00000800"   # 512 KiB
endian = "little"

[[magic]]
hex = "00001000"   # 1 MiB
endian = "little"

[[magic]]
hex = "00002000"   # 2 MiB
endian = "little"

[[magic]]
hex = "00004000"   # 4 MiB
endian = "little"

[[magic]]
hex = "00008000"   # 8 MiB
endian = "little"

[[magic]]
hex = "00000001"   # 16 MiB
endian = "little"

[[magic]]
hex = "00000002"   # 32 MiB
endian = "little"

[[magic]]
hex = "00000004"   # 64 MiB
endian = "little"

[[magic]]
hex = "00000008"   # 128 MiB
endian = "little"

[doc]
description = "Ingenic jzlzma (hardware LZ77) stream, raw form without the mark_rootfs_lzma wrapper — found as the 'lzma' payload of uImage images on T40/T41 camera SoCs (Wyze Cam v4 and similar)."
references = [
  { title = "binwalk PR #957 — jzlzma detection + decompressor", url = "https://github.com/ReFirmLabs/binwalk/pull/957" },
]
