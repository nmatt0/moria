# NOTE: all root-level keys must precede the first [[magic]] / [doc] table.
name = "cab"
category = "archive"

# Microsoft Cabinet. "MSCF" then three reserved DWORDs that are zero in every
# cabinet the format defines, the total size, the offset of the file table, and
# the format version (1.3 for every cabinet in the wild). Folders hold the
# compressed streams; files are slices of a folder's decompressed output, so the
# validator walks both tables before believing the match.
struct = """
  bytes[4] signature;
  u32 reserved1;
  u32 cb_cabinet;
  u32 reserved2;
  u32 coff_files;
  u32 reserved3;
  u8  version_minor;
  u8  version_major;
  u16 folders;
  u16 files;
  u16 flags;
"""

constraints = [
  "reserved1 == 0",
  "reserved2 == 0",
  "reserved3 == 0",
  "version_major == 1",
  "cb_cabinet > 36",
  "coff_files >= 36",
  "coff_files < cb_cabinet",
  "folders > 0",
  "files > 0",
  "flags <= 7",
]

size = "cb_cabinet"
size_clamp = true

# Walks the folder/file tables, names the codec, flags a spanned set.
validator = "cab"

[[magic]]
ascii = "MSCF"
endian = "little"

[doc]
description = "Microsoft Cabinet archive (MSCF). Folder streams are stored, MSZIP (DEFLATE), Quantum, or LZX; Windows CE installer cabinets additionally carry a _setup.xml describing the real install paths and registry keys."
references = [
  { title = "[MS-CAB] Cabinet File Format", url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-cab/" },
]
