name = "uboot"
category = "bootloader"

# U-Boot embeds a version banner like "U-Boot 2019.07 (...)". This is a hint
# (the string can appear anywhere in a bootloader blob), so it stays at `magic`
# tier. Distinct enough that false positives are rare in binaries.
[[magic]]
ascii = "U-Boot 20"
endian = "little"
[[magic]]
ascii = "U-Boot 1."
endian = "little"

[doc]
description = "Das U-Boot startup program with version text present."
references = [
  { title = "Das U-Boot", url = "https://docs.u-boot.org/" },
]
