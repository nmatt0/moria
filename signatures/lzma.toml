name = "lzma"
category = "compression"

# Legacy standalone LZMA1 (".lzma alone") has no magic number. Its 13-byte header
# is [props u8][dict_size u32 LE][uncompressed_size u64 LE], then a raw LZMA1
# stream. The props byte is a parameter, not a magic, so anchor on the props
# values firmware actually ships, each followed by a dict size that is a multiple
# of 64 KiB (so its low 16 bits are 0):
#   5D 00 00  lc3/lp0/pb2, the default of xz --format=lzma and the LZMA SDK
#   6D 00 00  lc1/lp2/pb2, what OpenWrt's build uses for its kernels (#45)
# The validator then checks the header fields and trial-decodes to a clean
# end-of-stream marker, so a stray anchor in unrelated data is rejected (no
# false positive). Identify + extract.
magic_offset = 0
validator = "lzma"
confidence = "structural"

[[magic]]
hex = "5d0000"
endian = "little"

[[magic]]
hex = "6d0000"
endian = "little"

[doc]
description = "LZMA-compressed data (legacy .lzma alone container, LZMA1)."
references = [
  { title = "LZMA SDK / .lzma format", url = "https://tukaani.org/xz/xz-file-format.txt" },
]
