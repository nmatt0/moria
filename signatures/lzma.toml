name = "lzma"
category = "compression"

# Legacy standalone LZMA1 (".lzma alone") has no magic number. Its 13-byte header
# is [props u8][dict_size u32 LE][uncompressed_size u64 LE], then a raw LZMA1
# stream. Anchor on the near-universal firmware header prefix `5D 00 00`: props
# 0x5D (lc3/lp0/pb2, the toolchain default emitted by xz --format=lzma, LZMA SDK,
# and every vendor loader observed) followed by a dict size that is a multiple of
# 64 KiB (so its low 16 bits are 0). The validator then checks the header fields
# and trial-decodes to a clean end-of-stream marker, so a stray `5D 00 00` in
# unrelated data is rejected (no false positive). Identify + extract.
magic_offset = 0
validator = "lzma"
confidence = "structural"

[[magic]]
hex = "5d0000"
endian = "little"

[doc]
description = "LZMA-compressed data (legacy .lzma alone container, LZMA1)."
references = [
  { title = "LZMA SDK / .lzma format", url = "https://tukaani.org/xz/xz-file-format.txt" },
]
