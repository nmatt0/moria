name = "lzma"
category = "compression"

# Legacy standalone LZMA1 (".lzma alone") has no magic number. Its 13-byte header
# is [props u8][dict_size u32 LE][uncompressed_size u64 LE], then a raw LZMA1
# stream. The props byte varies with the (lc, lp, pb) parameters, so anchoring on
# a fixed props value (the old `5D 00 00` for the xz --format=lzma default) misses
# streams built with any other parameter set (issue #45: OpenWrt ath79 kernels use
# props 0x6D). Anchor instead on the format-invariant `00 00`: the low 16 bits of
# the dict_size field, which are always zero because every real encoder uses a dict
# size that is a multiple of 64 KiB. magic_offset = 1 places the structure start on
# the props byte that precedes those two zero bytes. Like yaffs2's 0xFFFF anchor,
# the `00 00` pattern is common, so the validator earns the finding: it checks
# props <= 224 (exactly the valid (lc, lp, pb) set), a power-of-two dict in range,
# and trial-decodes to a clean end-of-stream marker, so unrelated `?? 00 00` data
# is rejected (no false positive). Identify + extract.
magic_offset = 1
validator = "lzma"
confidence = "structural"

[[magic]]
hex = "0000"
endian = "little"

[doc]
description = "LZMA-compressed data (legacy .lzma alone container, LZMA1)."
references = [
  { title = "LZMA SDK / .lzma format", url = "https://tukaani.org/xz/xz-file-format.txt" },
]
