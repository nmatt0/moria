name = "dtb"
category = "dtb"

struct = """
  bytes[4] magic;
  u32 totalsize;
  u32 off_dt_struct;
  u32 off_dt_strings;
  u32 off_mem_rsvmap;
  u32 version;
  u32 last_comp_version;
  u32 boot_cpuid_phys;
  u32 size_dt_strings;
  u32 size_dt_struct;
"""

# Cross-check the internal offsets against the reported total size.
constraints = [
  "version in 16..17",
  "last_comp_version in 2..17",
  "totalsize > 64",
  "totalsize <= _avail",
  "off_mem_rsvmap >= 40",
  "off_mem_rsvmap < totalsize",
  "off_dt_struct < totalsize",
  "off_dt_strings <= totalsize",
]

size = "totalsize"
confidence = "consistent"   # internal offsets are mutually consistent
validator = "dtb"           # reclassify a FIT (FDT with an /images node) as `fit`

# Flattened Device Tree (FDT) blob. Big-endian header.
[[magic]]
hex = "d00dfeed"
endian = "big"

[doc]
description = "Flattened Device Tree (FDT/DTB) file; tells the kernel or startup program about the hardware."
references = [
  { title = "Devicetree Specification", url = "https://www.devicetree.org/specifications/" },
]
